[project]
name = "anvil"
version = "0.2.0"
description = "ANVIL — self-mutating agent harness on Databricks. Runtime + Eval + Optimizer + Loop, 5 planes physically separated."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "databricks-sdk>=0.40.0",
    "databricks-agents>=0.16.0",
    "mlflow[databricks]>=3.11.0",
    "openai>=1.60.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
    "mypy>=1.14",
]
# Streamlit dashboard for round exploration. Kept separate from `dev`
# so test runs stay light.
dashboard = [
    "streamlit>=1.39.0",
    "plotly>=5.0",
    "altair>=5.0",
    "pandas>=2.0",
    "tabulate>=0.9",
]
# Optimizer extras — kept out of the runtime install so the deployed
# App container stays minimal.
optimizer = [
    "claude-agent-sdk>=0.1.0",
    "anthropic>=0.40",
]

[build-system]
# >=1.27 for PEP 639: the `license = "Apache-2.0"` SPDX string and
# `license-files` above are only understood from that version on. Pinned so a
# stale backend fails with a clear resolution error rather than a confusing
# metadata one.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Pin the package index to public PyPI at the *project* level, so the lockfile
# stays portable no matter what index the machine running `uv lock` defaults to.
#
# This is not hypothetical: a Databricks laptop typically has
# `~/.config/uv/uv.toml` pointing at an internal pypi proxy, and a lock
# regenerated there records that host in every wheel URL. The result is a
# lockfile only reachable from inside the corporate network -- CI fails on
# `uv sync --locked` with a connection timeout, external contributors cannot
# install at all, and internal infrastructure hostnames end up committed to a
# public repository. User-level config is silent about all of this; project-level
# config overrides it.
#
# Anyone who genuinely needs the proxy can still set `UV_INDEX` for a single run
# without touching the lock. The corollary is that regenerating the lock needs
# real access to pypi.org: on a machine where only the proxy resolves, `uv lock`
# will fail here rather than silently producing an unportable lockfile, which is
# the intended behaviour. Re-lock from CI, or from a network that can reach PyPI.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/anvil"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# `live` is deselected by default: the whole suite must pass with no
# credentials and no network. Opt in with `-m live`.
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "unit: pure, in-process, no I/O beyond tmp_path",
    "contract: exercises a boundary contract against a mock or local file store",
    "live: requires a real Databricks workspace; never runs in default CI",
]

[tool.mypy]
python_version = "3.12"
files = ["src/anvil"]
# The dashboard's deps (streamlit/plotly/pandas) live in the optional
# `dashboard` extra and are absent from CI, so type-checking it would fail on
# missing imports rather than on anything real.
exclude = "^src/anvil/dashboard/"
# Strict-by-default for new code. Existing modules are exempted below and
# the exemption list only ever shrinks -- do not add to it.
strict = true
warn_unused_configs = true
warn_unreachable = true

# Legacy debt: these 15 modules predate strict typing (89 errors at the time
# this gate landed). 20 of 35 modules are already clean, including the gate
# (`loop/frontier.py`, `loop/decision.py`). Each hardening phase that rewrites
# a module below must delete its line. This list is a ratchet -- append never.
[[tool.mypy.overrides]]
module = [
    "anvil.data.golden_set",
    "anvil.eval.cache",
    "anvil.eval.runner",
    "anvil.eval.scorers",
    "anvil.loop.builder",
    "anvil.loop.round",
    "anvil.optimizer.applier",
    "anvil.optimizer.session",
    "anvil.runtime.agent",
    "anvil.runtime.client",
    "anvil.runtime.composer",
    "anvil.runtime.models",
    "anvil.tools.search_knowledge_base",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

# What is left is MLflow's own typing, not ANVIL's. Each entry below names the
# codes that module needs and nothing more, so a *new* mismatch of any other
# kind is still an error. `docs/type-debt.md` itemises them.
#
# Four modules left this list outright when the mismatches they were carrying
# were fixed rather than silenced: `anvil.eval.cache`, `anvil.optimizer.session`,
# `anvil.runtime.client`, `anvil.tools.search_knowledge_base`.
[[tool.mypy.overrides]]
module = ["anvil.runtime.agent"]
# `ResponsesAgent` is not in `mlflow.pyfunc.__all__`; its `predict` signature
# diverges from `PythonModel.predict` by MLflow's own design; and
# `ResponsesAgentResponse(output=...)` is documented to take plain dicts while
# being annotated `list[OutputItem]`. All three are upstream, and "fixing" them
# against a moving target would be worse than naming them.
disable_error_code = ["arg-type", "attr-defined", "override"]

[[tool.mypy.overrides]]
module = ["anvil.eval.runner"]
# `mlflow.genai.evaluation.harness` exports none of the internals the resilient
# eval shim has to patch, and the patched callables are deliberately looser than
# the originals. `list-item` is `ResponsesAgentRequest(input=[{...}])`, the same
# MLflow dict-vs-typed-item gap as above.
disable_error_code = ["assignment", "attr-defined", "list-item"]

# Third-party packages without stubs. Narrow, per-module, never blanket.
[[tool.mypy.overrides]]
module = [
    "claude_agent_sdk.*",
    "databricks.*",
    "mlflow.*",
    "yaml",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["anvil"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
