sampling:
  temperature: 0.3
  top_p: null
  max_tokens: 2048
  tool_choice: auto
  max_tool_calls: 4
skills:
- file: identity.md
- file: citation.md
- file: synthesis.md
- file: refusal.md
rules:
- file: citation_discipline.md
- file: scope_discipline.md
tools:
- name: search_knowledge_base
  description: 'Search the news-article knowledge base by natural-language query.

    Returns the top-k matching articles, each with doc_id, title, source,

    publication date, and a snippet of the body. Use it for any factual

    question — and use it more than once, with rephrased queries, when a

    question needs facts from several articles. If the result is "No matching

    policy documents." the knowledge base does not cover the question; say

    so instead of answering from general knowledge.

    '
  parameters:
    type: object
    properties:
      query:
        type: string
        description: Natural-language search query over the article knowledge base.
      k:
        type: integer
        description: Maximum number of articles to return (default 3).
    required:
    - query
