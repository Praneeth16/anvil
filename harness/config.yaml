# ANVIL runtime config — IMMUTABLE.
#
# This file is OUTSIDE the optimizer's writable scope. It holds the
# runtime model identities, the optimizer loop's meta-configuration,
# and the MLflow experiment paths.
#
# The optimizer must NOT rewrite this file — changing endpoints
# mid-loop invalidates the comparative metric, and letting the
# optimizer rewrite its own lookback window is a recursion the loop's
# gate is not designed to catch.
#
# Anything mutation-worthy (sampling, skills, rules, tools) lives in
# `scaffold/harness.yaml`.

# Optimization mode — what FORGE mutates.
#   prompt — prompt scaffolds (skills/rules/sampling in markdown + YAML).
#            The default; backward compatible with all existing rounds.
#   code   — agent Python code (MemorySystem subclasses in agents/).
#            The eval imports the active agent module instead of
#            composing a prompt from scaffold/. When code, set
#            agent_module below (or accept the default
#            anvil.agents.baseline).
mode: prompt
# agent_module: anvil.agents.baseline

# Endpoint the runtime agent calls. Provider-agnostic — any
# OpenAI-compatible Databricks serving endpoint works.
runtime_endpoint: databricks-claude-sonnet-4-6

# Endpoint the ANVIL optimizer loop calls for trace analysis +
# mutation planning. Not read by the runtime agent.
optimizer_endpoint: databricks-claude-opus-4-7

# Endpoint the MLflow LLM judges call. Same as runtime by default;
# kept separate so a future round can pin a different judge model.
judge_endpoint: databricks-claude-sonnet-4-6

# MLflow experiment paths. Stable, declared here, NOT driven by
# environment variables (which lint/format passes have historically
# clobbered). The CLI may override per-run via --experiment-suffix
# but the suffix is appended in-process, never via env-var.
#
# Defaults to ``/Shared`` so the harness boots in any workspace.
# Per-user paths (``/Users/<email>/anvil-runtime``) work too — edit
# below to taste.
experiments:
  runtime:   "/Shared/anvil-runtime"
  eval:      "/Shared/anvil-eval"
  optimizer: "/Shared/anvil-optimizer"

# Loop configuration — how the ANVIL optimizer schedules itself.
loop:
  target_rounds: 50
  stretch_rounds: 100
  cost_budget_usd_per_round: 5.0
  # Early-stop if N consecutive rounds produce no positive
  # score_delta.
  early_stop_after_stalled_rounds: 10
  # How many past critiques to include in the next round's context.
  critique_lookback: 3
  # How many past reverted mutations to surface to the planner so it
  # avoids re-proposing what was already tried.
  revert_lookback: 20
  # Hard cap on optimizer turns per round. Round aborts as `noop` if
  # exceeded.
  max_optimizer_turns: 30

# Eval configuration.
eval:
  # Permit the one-time held-out evaluation performed by scripts/finalize.py.
  held_out_test: true
  # Default mode for `evaluate_branch`. One of: quick, standard, full.
  default_mode: quick
  # Row count per mode (deterministic sub-set of the golden set).
  modes:
    quick:    {rows: 8,  buckets: {direct: 2, multi_hop: 2, distractor: 2, out_of_scope: 2}}
    standard: {rows: 12, buckets: {direct: 4, multi_hop: 4, distractor: 2, out_of_scope: 2}}
    full:     {rows: 20, buckets: {direct: 6, multi_hop: 6, distractor: 4, out_of_scope: 4}}
    test:     {rows: 20, buckets: {direct: 6, multi_hop: 6, distractor: 4, out_of_scope: 4}}
  # Parallelism for predict_fn rows. Tune down if TPM saturates.
  n_workers: 4
  # Cooldown seconds between row tasks inside the thread pool when
  # the endpoint is approaching its quota.
  inter_row_cooldown_s: 0.0
  # Scorers active by default. Each entry may be a bare name string
  # (legacy form → type: llm, weight: 1.0) or a dict with ``name``,
  # ``type`` (``llm`` or ``programmatic``), ``weight`` (default 1.0),
  # and — for programmatic scorers — ``check_function`` (the name of a
  # function in ``data/evaluator.py``). The aggregate is a weighted
  # average across all configured scorers; uniform weights collapse to
  # the legacy unweighted mean.
  #
  # Safety is excluded from the aggregate by design — it has been a
  # flat 1.000 in every measured round and provides no gradient. It can
  # be re-added as a guard-only check via --include-safety.
  scorers:
    - correctness
    - retrieval_groundedness
    - refusal_appropriateness
    # Mixed llm + programmatic example (uncomment to enable). This
    # REPLACES the three bare-string scorers above — do not uncomment
    # both forms; the mixed form re-declares the three llm scorers with
    # explicit weights. The programmatic scorers below are deterministic
    # — no LLM call — and load their check functions from
    # data/evaluator.py.
    # - name: correctness
    #   type: llm
    #   weight: 0.4
    # - name: retrieval_groundedness
    #   type: llm
    #   weight: 0.3
    # - name: refusal_appropriateness
    #   type: llm
    #   weight: 0.3
    # - name: exact_match
    #   type: programmatic
    #   check_function: exact_match
    #   weight: 0.2
    # - name: schema_validity
    #   type: programmatic
    #   check_function: json_schema_validity
    #   weight: 0.2
  safety_guard_threshold: 0.95

# Gate configuration — how a round's mutation is accepted or rejected.
#
# The gate replaces the legacy frozen-baseline delta. The old gate kept
# any mutation whose aggregate beat the cached baseline; that silently
# allowed regressions (a round worse than a previous KEPT round but
# still above the baseline was kept).
gate:
  # Gate strategy.
  #   frontier — Pareto frontier (default). A mutation is KEPT only if it
  #              improves at least one tracked objective (per-judge scores
  #              + the aggregate) without regressing any other by more
  #              than ``epsilon``. The frontier — best-so-far per
  #              objective — persists to eval/runs/frontier.json and is
  #              initialized from the baseline on the first scored round.
  #              A round that scores worse than the best-so-far is REVERTED
  #              even if it still beats the frozen baseline.
  #   delta    — Legacy frozen-baseline behavior. A mutation is KEPT iff
  #              its aggregate beats the cached baseline aggregate
  #              (score_delta > 0). Backward compatible; the frontier file
  #              is not used.
  type: frontier
  # Minimum improvement on an objective to count as "better". With 0.0 a
  # strict positive delta is required — a tie (no objective improves)
  # does not extend the frontier and is reverted.
  epsilon: 0.0
  # Multi-objective optimization (only used when type: frontier). Disabled
  # preserves the single aggregate objective used by older configurations.
  pareto:
    enabled: false
    # Example:
    # objectives:
    #   - name: quality
    #     direction: maximize
    #     source: aggregate
    #   - name: cost
    #     direction: minimize
    #     source: context_chars  # or tokens when trace usage is available
