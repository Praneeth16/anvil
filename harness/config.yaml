# ANVIL runtime config — IMMUTABLE.
#
# This file is OUTSIDE the optimizer's writable scope. It holds the
# runtime model identities, the optimizer loop's meta-configuration,
# and the MLflow experiment paths.
#
# The optimizer must NOT rewrite this file — changing endpoints
# mid-loop invalidates the comparative metric, and letting the
# optimizer rewrite its own lookback window is a recursion the loop's
# gate is not designed to catch.
#
# Anything mutation-worthy (sampling, skills, rules, tools) lives in
# `scaffold/harness.yaml`.

# Optimization mode — what ANVIL mutates.
#   prompt — prompt scaffolds (skills/rules/sampling in markdown + YAML).
#            The default; backward compatible with all existing rounds.
#   code   — agent Python code (MemorySystem subclasses in agents/).
#            The eval imports the active agent module instead of
#            composing a prompt from scaffold/. When code, set
#            agent_module below (or accept the default
#            anvil.agents.baseline).
mode: prompt
# agent_module: anvil.agents.baseline

# LLM model names (FMAPI) routed through the Databricks AI Gateway.
# All three paths (runtime, optimizer, judge) use the same gateway
# unified URL — the model name determines which FMAPI model is called.
# Set DATABRICKS_HOST and DATABRICKS_TOKEN in the environment (or a
# ~/.databrickscfg profile); the gateway client refreshes the SP token
# on each request.
runtime_endpoint: databricks-claude-sonnet-4-6

# FMAPI model the ANVIL optimizer loop uses for trace analysis +
# mutation planning. Reached via the gateway's Anthropic route (the
# Claude Agent SDK), not the OpenAI-compatible route. Not read by the
# runtime agent.
optimizer_endpoint: databricks-claude-opus-4-7

# FMAPI model the MLflow LLM judges call — through the same gateway
# client as the runtime agent. Kept separate so a future round can pin
# a different judge model.
judge_endpoint: databricks-claude-sonnet-4-6

# The refusal judge's own description of the domain it is grading. Left unset
# here, which means the shipped MultiHopRAG defaults in `anvil.eval.scorers`
# are used.
#
# Set both to grade a different domain without touching library code. See
# `examples/` for worked cases, and note the consequence: these two strings
# change what the refusal judge measures, so they are folded into the scorer
# fingerprint and setting them INVALIDATES `eval/runs/baseline.json` by design.
# Regenerate the baseline with scripts/make_baseline.py after changing them.
#
# They live in this file, not in `scaffold/`, because the optimizer is graded by
# this judge and must not be able to rewrite its own grader.
#
# judge_domain_name: MultiHopRAG
# judge_domain_context: |-
#   Domain: MultiHopRAG, a multi-hop question-answering benchmark over a
#   news-article corpus. The agent has a knowledge base of news articles
#   and a `search_knowledge_base` tool. Many questions require combining
#   facts from several articles. The agent should refuse questions the
#   articles do not answer and answer covered ones using the knowledge
#   base.

# MLflow experiment paths. Stable, declared here, NOT driven by
# environment variables (which lint/format passes have historically
# clobbered). The CLI may override per-run via --experiment-suffix
# but the suffix is appended in-process, never via env-var.
#
# Defaults to ``/Shared`` so the harness boots in any workspace.
# Per-user paths (``/Users/<email>/anvil-runtime``) work too — edit
# below to taste.
experiments:
  runtime:   "/Shared/anvil-runtime"
  eval:      "/Shared/anvil-eval"
  optimizer: "/Shared/anvil-optimizer"

# Loop configuration — how the ANVIL optimizer schedules itself.
loop:
  target_rounds: 50
  stretch_rounds: 100
  cost_budget_usd_per_round: 5.0
  # Early-stop if N consecutive rounds produce no positive
  # score_delta.
  early_stop_after_stalled_rounds: 10
  # How many past critiques to include in the next round's context.
  critique_lookback: 3
  # How many past reverted mutations to surface to the planner so it
  # avoids re-proposing what was already tried.
  revert_lookback: 20
  # Hard cap on optimizer turns per round. Round aborts as `noop` if
  # exceeded.
  max_optimizer_turns: 30

# Eval configuration.
eval:
  # Permit the one-time held-out evaluation performed by scripts/finalize.py.
  held_out_test: true
  # Default mode for `evaluate_branch`. One of: quick, standard, full.
  #
  # `full` — the whole 50-row dev partition — because that is where the paired
  # gate's power comes from: a sign test over ~30 discordant pairs detects a
  # q=0.65-0.70 mutation with power 0.5-0.7, where 12-15 rows could not (issue
  # #15 measured 0.185). This costs 50 rows of eval per round instead of 12;
  # that is the intended trade, and quick (9) remains for smoke checks. This
  # must also match the mode `eval/runs/baseline.json` was generated at: the
  # round path compares against the cached aggregate without checking the modes
  # agree, so a mismatch would silently compare means over different row sets.
  default_mode: full
  # Anti-overfit data split (issues #15/#21 — enabled). The 120-row golden set
  # is partitioned by hash of example_id into train (40 rows; reserved for
  # optimizer-visible use, currently not scored), dev (50 rows; round-by-round
  # eval), and test (30 rows; held-out finalization only — scripts/finalize.py
  # is the sole caller allowed to run test mode). Membership is deterministic
  # and the vendoring script pins the per-bucket table exactly; any change to
  # ratios, seed, or example_ids requires re-running
  # scripts/build_multihop_domain.py --check.
  split:
    enabled: true
    train_ratio: 0.3333   # 40/120
    dev_ratio: 0.4167     # 50/120; remainder 0.25 -> 30 test
    seed: 42
  # Row count per mode. With split enabled, non-test bucket counts are declared
  # at FULL-SET scale and scaled by split.dev_ratio (rounded, min 1) onto the
  # dev partition — `rows` documents the resulting dev count and is read only
  # by test mode, whose selection is the whole test partition. Do not hand-tune
  # without re-running the vendoring script's mode dry-run (banker's rounding:
  # round(2.5) == 2).
  modes:
    quick:    {rows: 9,  buckets: {direct: 5,  multi_hop: 7,  distractor: 5,  out_of_scope: 5}}
    standard: {rows: 15, buckets: {direct: 7,  multi_hop: 14, distractor: 6,  out_of_scope: 6}}
    full:     {rows: 50, buckets: {direct: 24, multi_hop: 48, distractor: 24, out_of_scope: 24}}
    test:     {rows: 30, buckets: {direct: 6,  multi_hop: 12, distractor: 6,  out_of_scope: 6}}
  # Parallelism for predict_fn rows. Tune down if TPM saturates.
  n_workers: 4
  # Cooldown seconds between row tasks inside the thread pool when
  # the endpoint is approaching its quota.
  inter_row_cooldown_s: 0.0
  # Fraction of ATTEMPTED cases that may go unscored before the round is
  # refused as unjudgeable rather than compared. Unscored covers both ways a
  # case produces no score: the prediction raised, or the row lost its trace
  # and vanished from the result frame. Both shrink the sample the aggregate
  # rests on, and only the first is visible as an "error". Past this ceiling
  # the round is an INFRA_FAIL and never a revert, so a bad afternoon on the
  # endpoint cannot discard a good mutation.
  max_error_rate: 0.2
  # Absolute floor on assessed cases (capped at the number of cases the run
  # ATTEMPTED, so a small smoke mode stays runnable while row loss cannot lower
  # the bar it should trip). Raising max_error_rate to ride out a
  # flaky endpoint would otherwise let the aggregate become the score of one
  # surviving row -- which post-exclusion can read 1.0 and EXTEND the frontier,
  # where before exclusion the same run scored ~0.12 and was reverted. A rate
  # ceiling cannot express this; only a count can. 0 disables the floor.
  min_scorable_rows: 4
  # Scorers active by default. Each entry may be a bare name string
  # (legacy form → type: llm, weight: 1.0) or a dict with ``name``,
  # ``type`` (``llm`` or ``programmatic``), ``weight`` (default 1.0),
  # and — for programmatic scorers — ``check_function`` (the name of a
  # function in ``data/evaluator.py``). The aggregate is a weighted
  # average across all configured scorers; uniform weights collapse to
  # the legacy unweighted mean.
  #
  # Safety is excluded from the aggregate by design — it has been a
  # flat 1.000 in every measured round and provides no gradient. It can
  # be re-added as a guard-only check via --include-safety.
  scorers:
    - correctness
    - retrieval_groundedness
    - refusal_appropriateness
    # Mixed llm + programmatic example (uncomment to enable). This
    # REPLACES the three bare-string scorers above — do not uncomment
    # both forms; the mixed form re-declares the three llm scorers with
    # explicit weights. The programmatic scorers below are deterministic
    # — no LLM call — and load their check functions from
    # data/evaluator.py.
    # - name: correctness
    #   type: llm
    #   weight: 0.4
    # - name: retrieval_groundedness
    #   type: llm
    #   weight: 0.3
    # - name: refusal_appropriateness
    #   type: llm
    #   weight: 0.3
    # - name: exact_match
    #   type: programmatic
    #   check_function: exact_match
    #   weight: 0.2
    # - name: schema_validity
    #   type: programmatic
    #   check_function: json_schema_validity
    #   weight: 0.2
  safety_guard_threshold: 0.95

# Gate configuration — how a round's mutation is accepted or rejected.
#
# The gate replaces the legacy frozen-baseline delta. The old gate kept
# any mutation whose aggregate beat the cached baseline; that silently
# allowed regressions (a round worse than a previous KEPT round but
# still above the baseline was kept).
gate:
  # Gate strategy.
  #   frontier — Pareto frontier (default). A mutation is KEPT only if it
  #              improves at least one tracked objective (per-judge scores
  #              + the aggregate) without regressing any other by more
  #              than ``epsilon``. The frontier — best-so-far per
  #              objective — persists to eval/runs/frontier.json and is
  #              initialized from the baseline on the first scored round.
  #              A round that scores worse than the best-so-far is REVERTED
  #              even if it still beats the frozen baseline.
  #   delta    — Legacy frozen-baseline behavior. A mutation is KEPT iff
  #              its aggregate beats the cached baseline aggregate
  #              (score_delta > 0). Backward compatible; the frontier file
  #              is not used.
  type: frontier
  # Minimum improvement on an objective to count as "better". With 0.0 a
  # strict positive delta is required — a tie (no objective improves)
  # does not extend the frontier and is reverted.
  epsilon: 0.0
  # Does the improvement survive contact with judge noise?
  #
  #   paired — (default) after the frontier says KEEP, require the improvement
  #            to clear a one-sided paired sign test over the PER-ROW scores.
  #   none   — legacy: any delta clearing `epsilon` promotes.
  #
  # Why this and not a bigger epsilon. Two healthy runs of the *same* scaffold,
  # the same rows and the same model scored 0.875 and 0.722 -- ~0.15 of aggregate
  # from judge noise alone. Every per-round gain the loop has actually produced
  # was 0.03-0.06. So an epsilon large enough to exclude the noise excludes every
  # real gain too. What makes the difference measurable is that both runs answer
  # the SAME questions: pairing the rows cancels the row-difficulty variance that
  # dominates the aggregate, and only the rows where the two runs disagree carry
  # information.
  #
  # The test is a veto on KEEP, never a promotion -- it cannot rescue a mutation
  # the frontier rejected for regressing. See src/anvil/eval/significance.py.
  test: paired
  # Significance level for the paired test. 0.05 needs at least 5 rows to
  # disagree (a clean sweep of 4 gives p = 0.0625), so below that the round is
  # reported as underpowered and reverted rather than promoted on evidence that
  # could not have contradicted itself.
  alpha: 0.05
  # How many times to evaluate each candidate. 1 costs nothing extra.
  #
  # EXPECT MORE REVERTS AT 1. At 12 rows most real mutations do not flip 5 rows,
  # so many rounds will revert as "underpowered" -- which is honest, and is the
  # point: the alternative is promoting noise. Raising this averages the per-row
  # scores over replicates, which shrinks the judge's own inconsistency and lets
  # the same test see smaller effects. It costs exactly proportionally: 3 here is
  # 3x the eval spend per round, so at 50 rounds it is a budget decision.
  replicates: 1
  # Multi-objective optimization (only used when type: frontier). Disabled
  # preserves the single aggregate objective used by older configurations.
  pareto:
    enabled: false
    # Example:
    # objectives:
    #   - name: quality
    #     direction: maximize
    #     source: aggregate
    #   - name: cost
    #     direction: minimize
    #     source: context_chars  # or tokens when trace usage is available
